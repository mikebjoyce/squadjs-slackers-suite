;
  const N = DATA.N;
  const BETA_MIN=0.5, BETA_MAX=20, TAU_MIN=0.01, TAU_MAX=2.0;
  const grid = [];
  for (let i=0;i<N;i++) grid.push(new Array(N));
  DATA.points.forEach(function(p){
    const beta=p[0], tau=p[1], adj0=p[2], adj50=p[3];
    const i = Math.round((beta-BETA_MIN)/((BETA_MAX-BETA_MIN)/(N-1)));
    const j = Math.round((tau-TAU_MIN)/((TAU_MAX-TAU_MIN)/(N-1)));
    grid[i][j] = {beta:beta, tau:tau, adj0:adj0, adj50:adj50};
  });

  const MARKERS = [
    {beta:4.1667, tau:0.0833, color:'#898787'},
    {beta:4.1667, tau:0.25, color:'#4a3aa7'},
    {beta:4.85, tau:0.27, color:'#e34948'},
    {beta:4.25, tau:0.13, color:'#008300'}
  ];

  const canvas = document.getElementById('hm');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const marginL=42, marginB=30, marginT=8, marginR=8;
  const plotW = W-marginL-marginR, plotH = H-marginT-marginB;
  const cellW = plotW/N, cellH = plotH/N;
  let mode = 50;

  function colorFor(v, lo, hi){
    const t = Math.max(0, Math.min(1, (v-lo)/(hi-lo)));
    const stops = [[230,241,251],[181,212,244],[133,183,235],[55,138,221],[24,95,165],[12,68,124],[4,44,83]];
    const pos = t*(stops.length-1);
    const idx = Math.floor(pos);
    const frac = pos-idx;
    const a = stops[idx], b = stops[Math.min(idx+1,stops.length-1)];
    const r = Math.round(a[0]+(b[0]-a[0])*frac);
    const g = Math.round(a[1]+(b[1]-a[1])*frac);
    const bl= Math.round(a[2]+(b[2]-a[2])*frac);
    return 'rgb('+r+','+g+','+bl+')';
  }

  function getRange(){
    if (mode===0){
      let lo=Infinity,hi=-Infinity;
      DATA.points.forEach(function(p){ if(p[2]<lo) lo=p[2]; if(p[2]>hi) hi=p[2]; });
      return {lo:lo, hi:hi};
    } else {
      let lo=Infinity;
      DATA.points.forEach(function(p){ if(p[3]<lo) lo=p[3]; });
      return {lo:lo, hi: lo*1.16};
    }
  }

  function betaToX(beta){ return marginL + ((beta-BETA_MIN)/(BETA_MAX-BETA_MIN))*plotW; }
  function tauToY(tau){ return marginT + plotH - ((tau-TAU_MIN)/(TAU_MAX-TAU_MIN))*plotH; }

  function draw(){
    ctx.clearRect(0,0,W,H);
    const range = getRange(), lo=range.lo, hi=range.hi;
    for (let i=0;i<N;i++){
      for (let j=0;j<N;j++){
        const cell = grid[i][j];
        if(!cell) continue;
        const v = mode===0 ? cell.adj0 : cell.adj50;
        const clipped = Math.min(v, hi);
        ctx.fillStyle = colorFor(clipped, lo, hi);
        const x = marginL + i*cellW;
        const y = marginT + (N-1-j)*cellH;
        ctx.fillRect(x, y, cellW+0.6, cellH+0.6);
      }
    }
    ctx.font = '11px sans-serif';
    ctx.fillStyle = '#898781';
    ctx.textAlign='center';
    [0.5,5,10,15,20].forEach(function(b){ ctx.fillText(String(b), betaToX(b), H-marginB+14); });
    ctx.textAlign='right';
    [0,0.5,1,1.5,2].forEach(function(t){ ctx.fillText(String(t), marginL-6, tauToY(t)+3); });
    ctx.textAlign='center';
    ctx.fillText('BETA', marginL+plotW/2, H-4);
    ctx.save();
    ctx.translate(11, marginT+plotH/2);
    ctx.rotate(-Math.PI/2);
    ctx.fillText('TAU', 0, 0);
    ctx.restore();

    MARKERS.forEach(function(m){
      const x = betaToX(m.beta), y=tauToY(m.tau);
      ctx.beginPath();
      ctx.arc(x,y,4.5,0,Math.PI*2);
      ctx.fillStyle = m.color;
      ctx.fill();
      ctx.lineWidth=1.5;
      ctx.strokeStyle='#fff';
      ctx.stroke();
    });

    drawBar(lo,hi);
  }

  function drawBar(lo,hi){
    const bar = document.getElementById('bar');
    const bctx = bar.getContext('2d');
    const bh = bar.height;
    for(let y=0;y<bh;y++){
      const t = 1-y/bh;
      bctx.fillStyle = colorFor(lo+t*(hi-lo), lo, hi);
      bctx.fillRect(0,y,bar.width,2);
    }
    document.getElementById('scale-max').textContent = Math.round(hi).toLocaleString()+(mode===50?'+':'');
    document.getElementById('scale-min').textContent = Math.round(lo).toLocaleString();
  }

  const tooltip = document.getElementById('tooltip');
  canvas.addEventListener('mousemove', function(e){
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX-rect.left)*(canvas.width/rect.width);
    const my = (e.clientY-rect.top)*(canvas.height/rect.height);
    const i = Math.floor((mx-marginL)/cellW);
    const jFromTop = Math.floor((my-marginT)/cellH);
    const j = N-1-jFromTop;
    if(i<0||i>=N||j<0||j>=N){ tooltip.style.display='none'; return; }
    const cell = grid[i][j];
    if(!cell){ tooltip.style.display='none'; return; }
    const v = mode===0? cell.adj0: cell.adj50;
    tooltip.style.display='block';
    tooltip.style.left=(mx+12)+'px';
    tooltip.style.top=(my-8)+'px';
    tooltip.innerHTML = 'BETA '+cell.beta.toFixed(2)+', TAU '+cell.tau.toFixed(3)+'<br>adj. loss '+Math.round(v).toLocaleString();
  });
  canvas.addEventListener('mouseleave', function(){ tooltip.style.display='none'; });

  document.getElementById('btn-l50').addEventListener('click', function(){ mode=50; setActive(); draw(); });
  document.getElementById('btn-l0').addEventListener('click', function(){ mode=0; setActive(); draw(); });
  function setActive(){
    document.getElementById('btn-l50').classList.toggle('active', mode===50);
    document.getElementById('btn-l0').classList.toggle('active', mode===0);
  }
  setActive();
  draw();
})();
